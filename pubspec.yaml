name: yuewei_reader
description: "阅微 — 现代静谧纸感追更阅读器（Modern Soft UI v4 · Flutter + Drift）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.28
  dio: ^5.7.0
  fast_gbk: ^1.0.0
  html: ^0.15.5
  archive: ^3.6.1
  xml: ^6.5.0
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.7.6
  cached_network_image: ^3.4.1
  characters: ^1.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  lpinyin: ^2.0.3
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
